services:
  goaventura:
    image: ejgallegos/goaventura:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set NEXT_PUBLIC_FIREBASE_PROJECT_ID in .env.production}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set NEXT_PUBLIC_FIREBASE_APP_ID in .env.production}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set NEXT_PUBLIC_FIREBASE_API_KEY in .env.production}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET-}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID-}
        NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL-}
    container_name: goaventura-container
    networks:
      - "traefik-net"
    restart: always
    ports:
      - "127.0.0.1:3003:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.goaventura.rule=Host(`goaventura.com.ar`)
      - traefik.http.routers.goaventura.tls=true
      - traefik.http.routers.goaventura.entrypoints=web,websecure
      - traefik.http.routers.goaventura.tls.certresolver=mytlschallenge
    env_file:
      - .env.production
    volumes:
      - goaventura-data:/app/public/data
    tmpfs:
      - /tmp:size=50m,mode=1777
      - /var/tmp:size=50m,mode=1777
      - /app/.next/cache/images:uid=1001,gid=1001,mode=0755,size=50m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  goaventura-data:
    driver: local

networks:
  traefik-net:
    external: true
