services:
  goaventura:
    image: ejgallegos/goaventura:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goaventura-container
    networks:
      - "traefik-net"
      - "availability-internal"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - "127.0.0.1:3003:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.goaventura.rule=Host(`goaventura.com.ar`)
      - traefik.http.routers.goaventura.tls=true
      - traefik.http.routers.goaventura.entrypoints=web,websecure
      - traefik.http.routers.goaventura.tls.certresolver=mytlschallenge
    env_file:
      - .env.production
    volumes:
      - goaventura-data:/app/public/data
    tmpfs:
      - /tmp:size=50m,mode=1777
      - /var/tmp:size=50m,mode=1777
      - /app/.next/cache/images:uid=1001,gid=1001,mode=0755,size=50m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
    read_only: true
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: goaventura-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - goaventura-postgres-data:/var/lib/postgresql/data
    networks:
      - availability-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    image: goaventura-db-migrate:local
    build:
      context: .
      dockerfile: Dockerfile
      target: db-migrate
    profiles: ["tools"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - availability-internal
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

volumes:
  goaventura-data:
    driver: local
  goaventura-postgres-data:
    driver: local

networks:
  traefik-net:
    external: true
  availability-internal:
    internal: true
